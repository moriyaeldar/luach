spring:
  application:
    name: task-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasks_db}
    username: ${DB_USER:tasks}
    password: ${DB_PASSWORD:tasks}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: task-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    kafka:
      enabled: false

springdoc:
  api-docs:
    path: /api/tasks-docs

luach:
  jwt-secret: ${JWT_SECRET:local-development-secret-change-me-0123456789}
  household-service-url: ${HOUSEHOLD_SERVICE_URL:http://localhost:8082}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
