spring:
  application:
    name: task-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasks_db}
    username: ${DB_USER:tasks}
    password: ${DB_PASSWORD:tasks}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api/tasks-docs

luach:
  # Until the Household service exists (M2), the service runs for one demo household.
  household:
    id: 00000000-0000-0000-0000-000000000001
    in-israel: true
  demo-members:
    - { id: ima, he: "אמא", en: "Mom", color: "#7c3aed" }
    - { id: aba, he: "אבא", en: "Dad", color: "#0891b2" }
    - { id: noa, he: "נועה", en: "Noa", color: "#db2777" }
    - { id: itai, he: "איתי", en: "Itai", color: "#ea580c" }
