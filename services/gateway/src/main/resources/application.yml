spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: household-service
              uri: ${HOUSEHOLD_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/me,/api/households,/api/households/**,/api/invites/**
            - id: task-service
              uri: ${TASK_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/tasks,/api/tasks/**,/api/week,/api/recurrence/**

server:
  port: ${PORT:8080}
  # Behind a TLS-terminating proxy (Render, Caddy): trust X-Forwarded-Proto/Host when building redirect URLs.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

luach:
  jwt-secret: ${JWT_SECRET:local-development-secret-change-me-0123456789}
  cookie:
    secure: ${COOKIE_SECURE:true}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
