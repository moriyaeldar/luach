# Render Blueprint: free hosting for the demo (Render dashboard -> Blueprints -> New Blueprint Instance -> this repo).
#
# External free services, entered once in the dashboard when the Blueprint asks (sync: false):
#   - Neon Postgres: one database per service -> DATABASE_URL on luach-tasks-moriya and luach-households-moriya
#   - Aiven Kafka:   KAFKA_BOOTSTRAP_SERVERS + the three PEM values (plain, \n-escaped or base64) on both services
#   - Google OAuth:  GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET on luach-moriya (optional; demo login works without)
#
# Free services sleep after 15 minutes without traffic; the first request after that takes about a minute.
# Free services can't receive private-network traffic, so services call each other's public URLs.

services:
  # Public entry point: serves the Angular app, owns the session cookie, routes /api/** to the services.
  - type: web
    name: luach-moriya
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./deploy/gateway.Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: TASK_SERVICE_URL
        value: https://luach-tasks-moriya.onrender.com
      - key: HOUSEHOLD_SERVICE_URL
        value: https://luach-households-moriya.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=50 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1

  - type: web
    name: luach-households-moriya
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./deploy/java-service.Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: MODULE
        value: services/household-service
      - key: JWT_SECRET
        fromService:
          name: luach-moriya
          type: web
          envVarKey: JWT_SECRET
      - key: DATABASE_URL
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: aiven
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_CA_CERT
        sync: false
      - key: KAFKA_ACCESS_CERT
        sync: false
      - key: KAFKA_ACCESS_KEY
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=50 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1

  - type: web
    name: luach-tasks-moriya
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./deploy/java-service.Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: MODULE
        value: services/task-service
      - key: JWT_SECRET
        fromService:
          name: luach-moriya
          type: web
          envVarKey: JWT_SECRET
      - key: DATABASE_URL
        sync: false
      - key: HOUSEHOLD_SERVICE_URL
        value: https://luach-households-moriya.onrender.com
      - key: SPRING_PROFILES_ACTIVE
        value: aiven
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_CA_CERT
        sync: false
      - key: KAFKA_ACCESS_CERT
        sync: false
      - key: KAFKA_ACCESS_KEY
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=50 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1
